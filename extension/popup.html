<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
body { width: 360px; padding: 16px; font-family: system-ui; background: #fff; margin: 0; }
h1 { font-size: 1rem; color: #000091; margin-bottom: 12px; }
input { width: 100%; padding: 10px; border: 2px solid #e5e5e5; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #000091; color: #fff; font-weight: 700; margin-top: 8px; cursor: pointer; }
.result { margin-top: 12px; padding: 12px; background: #f6f6f6; border-radius: 8px; font-size: 12px; }
.label { color: #666; font-size: 10px; text-transform: uppercase; font-weight: 700; }
.val { color: #000091; font-weight: 700; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>🇪🇺 ESA Encyclopedia</h1>
<input type="text" id="mot" placeholder="vulcain, ariane6, galileo...">
<button id="btn">🔍 Analyser</button>
<div id="result" class="result" style="display:none;"></div>
<script src="popup.js"></script>
</body>
</html>
